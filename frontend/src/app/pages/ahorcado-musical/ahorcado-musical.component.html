<div class="game">

  <!-- TOP -->
  <header class="topbar">
    <div class="title">Ahorcado Musical</div>

    <button class="btn-back" routerLink="/juegos">
      ⬅ Volver
    </button>
  </header>

  <!-- MAIN -->
  <main class="layout">

    <!-- LEFT -->
    <aside class="panel">

      <div class="stat">
        <span>Vidas</span>
        <b class="danger">❤️ {{ intentosRestantes }}</b>
      </div>

      <div class="hang-box">
        <div class="hang-circle">
          {{ intentosRestantes }}
        </div>
      </div>

    </aside>

    <!-- RIGHT -->
    <section class="panel game-panel">

      <!-- WORD -->
      <div class="word">
        <span *ngFor="let l of palabraOculta"
              class="letter"
              [class.filled]="l !== '_'">
          {{ l === '_' ? '' : l }}
        </span>
      </div>

      <!-- FAILS -->
      <div class="fails" *ngIf="letrasFalladas.length">
        ❌ {{ letrasFalladas.join(' · ') }}
      </div>

      <!-- INPUTS -->
      <div class="inputs">

        <div class="input-box">
          <input [(ngModel)]="letraInput" maxlength="1" placeholder="Letra">
          <button (click)="adivinarLetra()">OK</button>
        </div>

        <div class="input-box">
          <input [(ngModel)]="palabraInput" placeholder="Palabra completa">
          <button (click)="adivinarPalabraCompleta()">GO</button>
        </div>

      </div>

      <!-- MENU FINAL -->
      <div class="end-menu" *ngIf="mostrarMenuFinal">

        <h2>🎉 ¡Fin de la partida!</h2>

        <p>¿Qué quieres hacer?</p>

        <div class="menu-buttons">

          <button (click)="reiniciar()">🔁 Seguir jugando</button>

          <button routerLink="/juegos">🏠 Volver</button>

        </div>

      </div>

    </section>

  </main>

</div>
