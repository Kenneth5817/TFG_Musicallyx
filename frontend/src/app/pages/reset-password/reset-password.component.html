<div class="reset-container">
  <div class="reset-card">

    <!-- Logo -->
    <div class="logo-container">
      <img src="https://drive.google.com/uc?export=view&id=1fJxSMYFN-OtjE6gwq3itFUVLUJn9W0oL"
           alt="Musicallyx"
           class="logo">
    </div>

    <h2>Restablecer Contraseña</h2>

    <!-- Mensaje de carga -->
    <div *ngIf="cargando" class="alert alert-info">
      <span class="spinner"></span> Verificando...
    </div>

    <!-- Mensaje de error -->
    <div *ngIf="error && !tokenValido" class="alert alert-error">
      <span class="icon">⚠️</span> {{ error }}
    </div>

    <!-- Token inválido -->
    <div *ngIf="!tokenValido && !cargando && mensaje" class="alert alert-warning">
      <p>{{ mensaje }}</p>
      <a routerLink="/recuperar-password" class="btn-link">Solicitar nuevo enlace</a>
    </div>

    <!-- Formulario de cambio de contraseña (solo si token válido) -->
    <form *ngIf="tokenValido" [formGroup]="resetForm" (ngSubmit)="cambiarPassword()" class="reset-form">

      <div class="form-group">
        <label for="password">Nueva Contraseña</label>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Mínimo 6 caracteres"
            class="form-control"
            [class.is-invalid]="resetForm.get('password')?.invalid && resetForm.get('password')?.touched">
        </div>
        <small *ngIf="resetForm.get('password')?.invalid && resetForm.get('password')?.touched" class="error-message">
          La contraseña debe tener al menos 6 caracteres
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="confirmPassword"
            formControlName="confirmPassword"
            placeholder="Repite tu nueva contraseña"
            class="form-control"
            [class.is-invalid]="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched">
        </div>
        <small *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched" class="error-message">
          Las contraseñas no coinciden
        </small>
      </div>

      <button type="submit" [disabled]="cargando || resetForm.invalid" class="btn-submit">
        {{ cargando ? 'Cambiando...' : 'Cambiar Contraseña' }}
      </button>
    </form>

    <!-- Mensaje de éxito -->
    <div *ngIf="mensaje && !error && tokenValido" class="alert alert-success">
      <span class="icon">✅</span> {{ mensaje }}
      <p class="redirect-message">Serás redirigido al inicio de sesión...</p>
    </div>

    <!-- Enlace para volver al login -->
    <div class="footer-links">
      <a routerLink="/iniciar-sesion" class="back-link">← Volver al inicio de sesión</a>
    </div>
  </div>
</div>
